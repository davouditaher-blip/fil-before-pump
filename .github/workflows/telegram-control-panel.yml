name: Telegram Control Panel

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: telegram-control-panel
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requests
        run: python -m pip install requests
      - name: Process Telegram buttons
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python telegram_menu.py

      - name: Save Telegram update offset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telegram_update_offset.txt
          if git diff --cached --quiet; then
            echo "No Telegram offset changes."
            exit 0
          fi
          git commit -m "Save Telegram bot update offset"
          git pull --rebase origin main
          git push origin HEAD:main
