name: GMGN Smart Money Layer

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fil-before-pump-repo-writers
  cancel-in-progress: false

jobs:
  gmgn-smart-money:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install requests

      - name: Install GMGN CLI
        run: npm install -g gmgn-cli

      - name: Run GMGN Smart Money layer
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gmgn_layer.py

      - name: Save GMGN wallet history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmgn_wallet_history.json
          if git diff --cached --quiet; then
            echo "No GMGN history changes."
            exit 0
          fi
          git commit -m "Update GMGN smart-money history"
          git push
