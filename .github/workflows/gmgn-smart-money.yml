name: GMGN Smart Money Layer

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanner-history-writer
  cancel-in-progress: false

jobs:
  gmgn-smart-money:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 10

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install requests

      - name: Install GMGN CLI
        run: npm install -g gmgn-cli

      - name: Restore GMGN wallet history archive
        run: |
          set -euo pipefail
          if [ -f gmgn_wallet_history.json.gz ]; then
            gzip -t gmgn_wallet_history.json.gz
            gzip -dc gmgn_wallet_history.json.gz > gmgn_wallet_history.json.tmp
            python -m json.tool gmgn_wallet_history.json.tmp >/dev/null
            mv gmgn_wallet_history.json.tmp gmgn_wallet_history.json
            echo "Restored compressed lifetime GMGN history."
          else
            echo "No compressed archive yet; using legacy JSON history."
          fi

      - name: Recover legacy GMGN history metadata once
        run: python recover_gmgn_history_metadata.py

      - name: Capture baseline GMGN history
        run: |
          set -euo pipefail
          if [ -f gmgn_wallet_history.json ]; then
            cp gmgn_wallet_history.json gmgn_wallet_history.baseline.json
          else
            printf '{}\n' > gmgn_wallet_history.baseline.json
          fi
          python validate_gmgn_history_preservation.py --baseline gmgn_wallet_history.baseline.json --current gmgn_wallet_history.baseline.json

      - name: Validate history merge modules
        run: python -m py_compile wallet_history_validation.py merge_gmgn_history_metadata.py recover_gmgn_history_metadata.py validate_gmgn_history_preservation.py build_proven_wallet_registry.py historical_depth_audit.py gmgn_backfill_capability_audit.py reverse_historical_discovery.py gmgn_layer.py

      - name: Run GMGN Smart Money layer
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python gmgn_layer.py

      - name: Restore baseline GMGN metadata after smart-money update
        run: python merge_gmgn_history_metadata.py --baseline gmgn_wallet_history.baseline.json --current gmgn_wallet_history.json

      - name: Rebuild PROVEN wallet registry from current GMGN archive
        id: proven_registry
        run: |
          set -euo pipefail
          old_digest="$(python -c 'import json,pathlib; p=pathlib.Path("proven_wallet_registry.json"); d=json.loads(p.read_text()) if p.exists() and p.stat().st_size else {}; print((d.get("determinism") or {}).get("payload_sha256",""))')"
          python build_proven_wallet_registry.py
          new_digest="$(python -c 'import json; print(json.load(open("proven_wallet_registry.json")).get("determinism",{}).get("payload_sha256",""))')"
          if [ "$old_digest" != "$new_digest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild reverse historical discovery from current GMGN archive
        id: reverse_discovery
        run: |
          set -euo pipefail
          old_digest="$(python -c 'import json,pathlib; p=pathlib.Path("reverse_historical_discovery.json"); print(json.loads(p.read_text()).get("determinism",{}).get("payload_sha256","") if p.exists() else "")')"
          python reverse_historical_discovery.py
          new_digest="$(python -c 'import json; print(json.load(open("reverse_historical_discovery.json")).get("determinism",{}).get("payload_sha256",""))')"
          if [ "$old_digest" != "$new_digest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild historical depth audit from current GMGN archive
        id: historical_depth
        run: |
          set -euo pipefail
          old_digest="$(python -c 'import json,pathlib; p=pathlib.Path("historical_depth_audit.json"); d=json.loads(p.read_text()) if p.exists() else {}; print((d.get("determinism") or {}).get("payload_sha256",""))')"
          python historical_depth_audit.py
          new_digest="$(python -c 'import json; print(json.load(open("historical_depth_audit.json")).get("determinism",{}).get("payload_sha256",""))')"
          if [ "$old_digest" != "$new_digest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild GMGN backfill capability audit from current code and archive
        id: gmgn_capability_audit
        run: |
          set -euo pipefail
          old_digest="$(python -c 'import json,pathlib; p=pathlib.Path("gmgn_backfill_capability_audit.json"); d=json.loads(p.read_text()) if p.exists() else {}; print((d.get("determinism") or {}).get("payload_sha256",""))')"
          python gmgn_backfill_capability_audit.py
          new_digest="$(python -c 'import json; print(json.load(open("gmgn_backfill_capability_audit.json")).get("determinism",{}).get("payload_sha256",""))')"
          if [ "$old_digest" != "$new_digest" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save GMGN wallet history
        run: |
          set -euo pipefail
          if [ ! -f gmgn_wallet_history.json ]; then
            echo "GMGN history file missing; refusing to overwrite the archive."
            exit 1
          fi
          python validate_gmgn_history_preservation.py --baseline gmgn_wallet_history.baseline.json --current gmgn_wallet_history.json
          python -m json.tool gmgn_wallet_history.json >/dev/null
          gzip -n -9 -c gmgn_wallet_history.json > gmgn_wallet_history.json.gz.tmp
          gzip -t gmgn_wallet_history.json.gz.tmp
          archive_bytes="$(wc -c < gmgn_wallet_history.json.gz.tmp)"
          if [ "$archive_bytes" -ge 90000000 ]; then
            echo "Compressed GMGN archive is unexpectedly large (${archive_bytes} bytes); refusing to commit."
            exit 1
          fi
          mv gmgn_wallet_history.json.gz.tmp gmgn_wallet_history.json.gz
          rm -f gmgn_wallet_history.json gmgn_wallet_history.baseline.json
          git rm --cached -f --ignore-unmatch gmgn_wallet_history.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gmgn_wallet_history.json.gz gmgn_history_recovery_done.json
          if [ "${{ steps.proven_registry.outputs.changed }}" = "true" ]; then
            git add proven_wallet_registry.json
          fi
          if [ "${{ steps.reverse_discovery.outputs.changed }}" = "true" ]; then
            git add reverse_historical_discovery.json
          fi
          if [ "${{ steps.historical_depth.outputs.changed }}" = "true" ]; then
            git add historical_depth_audit.json
          fi
          if [ "${{ steps.gmgn_capability_audit.outputs.changed }}" = "true" ]; then
            git add gmgn_backfill_capability_audit.json
          fi
          if git diff --cached --quiet; then
            echo "No GMGN history changes."
            exit 0
          fi
          git commit -m "Update GMGN smart-money history"

          # Another scheduled writer may have advanced main while this job ran.
          # Rebase onto the latest main and retry the push instead of failing the run.
          for attempt in 1 2 3 4 5; do
            echo "GMGN history push attempt $attempt/5"
            git fetch --deepen=20 origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict; refusing to prefer either history archive."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "GMGN history push succeeded."
              exit 0
            fi
            echo "Push raced with another writer; retrying without choosing either archive."
            sleep 10
          done

          echo "Unable to push GMGN history after 5 attempts."
          exit 1

      - name: Preserve GMGN history if persistence fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gmgn-history-failure-${{ github.run_id }}
          path: |
            gmgn_wallet_history.json.gz
            gmgn_wallet_history.json
            gmgn_wallet_history.baseline.json
            gmgn_wallet_history.json.gz.tmp
            gmgn_history_recovery_done.json
          if-no-files-found: ignore
          retention-days: 90
