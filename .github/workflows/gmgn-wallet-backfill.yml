name: GMGN Wallet Trade Backfill Test

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: "Wallet address to backfill"
        required: true
        default: "0x7bf30399dba8051c2bf191afe2cd07ea4e064625"
      chain:
        description: "Chain for this wallet address"
        required: true
        type: choice
        options: [eth, bsc, base, sol]
        default: "eth"
      limit:
        description: "Rows per page (1-200); cursor pagination continues until complete"
        required: true
        default: "100"

permissions:
  contents: write

concurrency:
  group: gmgn-wallet-backfill-archive
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node and Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GMGN CLI
        run: npm install -g gmgn-cli

      - name: Test backfill parser and persistence safety
        run: python -m unittest -v test_wallet_trade_backfill.py

      - name: Run GMGN wallet activity backfill
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          BACKFILL_WALLET: ${{ github.event.inputs.wallet }}
          BACKFILL_CHAIN: ${{ github.event.inputs.chain }}
          GMGN_ACTIVITY_LIMIT: ${{ github.event.inputs.limit }}
        run: python3 wallet_trade_backfill.py

      - name: Save GMGN historical archive
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A wallet_archive/raw/gmgn/activity
          if git diff --cached --quiet; then
            echo "No GMGN archive changes."
            exit 0
          fi
          git commit -m "Add GMGN wallet trade backfill"
          for attempt in 1 2 3 4 5; do
            echo "GMGN archive push attempt $attempt/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo "Rebase conflict; refusing to overwrite a historical activity archive."
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              echo "GMGN archive push succeeded."
              exit 0
            fi
            echo "Push raced with another writer; retrying."
            sleep 10
          done
          exit 1

      - name: Preserve backfill artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmgn-wallet-backfill-${{ github.run_id }}
          path: wallet_archive/raw/gmgn/activity/
          if-no-files-found: ignore
          retention-days: 90
