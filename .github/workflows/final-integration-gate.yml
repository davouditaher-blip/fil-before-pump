name: Final Integration Safety Gate

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Fil Before Pump Scanner"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Run final integration safety gate
        env:
          CMC_API_KEY: test
          TELEGRAM_BOT_TOKEN: test
          TELEGRAM_CHAT_ID: test
        run: python final_integration_gate.py
      - name: Confirm live execution remains disabled
        run: |
          python - <<'PY'
import json
data=json.load(open("trade_readiness.json",encoding="utf-8"))
assert data.get("mode") == "READ_ONLY_PAPER"
assert data.get("orders_enabled") is False
print("LIVE EXECUTION: DISABLED")
print("FINAL INTEGRATION GATE WORKFLOW: PASS")
PY
