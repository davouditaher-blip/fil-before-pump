name: Telegram Fil Before Pump Scan

on:
  workflow_dispatch:
    inputs:
      rank_range:
        description: "Telegram rank range"
        required: false
        type: string
        default: "all"
      filter:
        description: "Telegram filter"
        required: false
        type: string
        default: "all"

permissions:
  contents: write

concurrency:
  group: scanner-history-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          npm install -g gmgn-cli

      - name: Run deterministic smoke tests
        run: python smoke_test.py

      - name: Build wallet quality
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
          GOLDRUSH_API_KEY: ${{ secrets.GOLDRUSH_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
        run: |
          set +e
          for attempt in 1 2 3; do
            WALLET_QUALITY_ONLY=1 python wallet_quality_engine.py
            status=$?
            if [ "$status" -eq 0 ]; then exit 0; fi
            [ "$attempt" -lt 3 ] && sleep 20
          done
          exit "$status"

      - name: Build cross-wallet clusters
        run: python wallet_clustering.py

      - name: Build $5K Wallet Radar
        env:
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
        run: python wallet_radar.py

      - name: Run integrated Fil Before Pump scanner
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
          GOLDRUSH_API_KEY: ${{ secrets.GOLDRUSH_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
          BOT_RANK_RANGE: ${{ inputs.rank_range || 'all' }}
          BOT_FILTER: ${{ inputs.filter || 'all' }}
        run: python wallet_quality_engine.py

      - name: Save scanner history safely
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volume_history.json wallet_history.json wallet_events.json futures_volume_history.json gmgn_wallet_history.json wallet_quality.json wallet_clusters.json wallet_radar.json trade_readiness.json paper_trades.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "Update scanner wallet intelligence from Telegram"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort || true
            sleep 10
          done
          exit 1

  health:
    if: ${{ always() }}
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render health
        run: |
          code="$(curl -L --max-time 20 -sS -o /tmp/render_body -w "%{http_code}" "https://fil-before-pump.onrender.com/")"
          echo "Render HTTP status: $code"
          test "$code" -ge 200 -a "$code" -lt 500
