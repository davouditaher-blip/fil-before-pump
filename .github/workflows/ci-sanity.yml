name: CI Sanity

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests
      - run: CMC_API_KEY=test TELEGRAM_BOT_TOKEN=test TELEGRAM_CHAT_ID=test python -m py_compile scanner.py
      - run: CMC_API_KEY=test TELEGRAM_BOT_TOKEN=test TELEGRAM_CHAT_ID=test python smoke_test.py
      - run: python -m py_compile final_integration_gate.py e2e_validate.py
