name: CI Sanity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests pytest
      - run: CMC_API_KEY=test TELEGRAM_BOT_TOKEN=test TELEGRAM_CHAT_ID=test python -m py_compile scanner.py wallet_trade_backfill.py nansen_backfill.py reverse_historical_discovery.py audit_compressed_gmgn_archive.py test_history_persistence_workflows.py validate_gmgn_history_preservation.py test_gmgn_chain_attribution.py test_gmgn_portfolio_activity.py gmgn_layer.py test_gmgn_update_history.py test_gmgn_history_merge.py recover_gmgn_history_metadata.py merge_gmgn_history_metadata.py wallet_history_validation.py
      - run: python audit_compressed_gmgn_archive.py
      - run: python reverse_historical_discovery.py
      - run: python reverse_historical_discovery.py --verify
      - run: python -m unittest -v test_wallet_trade_backfill.py
      - run: python -m unittest -v test_history_persistence_workflows.py
      - run: python -m unittest -v test_gmgn_history_preservation.py
      - run: python -m unittest -v test_gmgn_history_merge.py
      - run: python -m unittest -v test_gmgn_chain_attribution.py
      - run: python -m unittest -v test_gmgn_portfolio_activity.py
      - run: python -m unittest -v test_gmgn_update_history.py
      - run: python -m pytest -q test_wallet_history_validation.py
      - run: python -m unittest -v test_gmgn_backfill_capability_audit.py
      - run: python -m unittest -v test_reverse_historical_discovery.py
      - run: CMC_API_KEY=test TELEGRAM_BOT_TOKEN=test TELEGRAM_CHAT_ID=test python smoke_test.py
      - run: python -m py_compile final_integration_gate.py e2e_validate.py
