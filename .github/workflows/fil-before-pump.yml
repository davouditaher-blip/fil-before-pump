name: Fil Before Pump Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# جلوگیری از اجرای همزمان Workflow
concurrency:
  group: fil-before-pump-scanner
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          CMC_API_KEY = os.environ["CMC_API_KEY"]
          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          DATA_FILE = Path("volume_history.json")

          headers = {
              "X-CMC_PRO_API_KEY": CMC_API_KEY,
              "Accept": "application/json"
          }

          url = (
              "https://pro-api.coinmarketcap.com/v1/"
              "cryptocurrency/listings/latest"
          )

          params = {
              "start": 1,
              "limit": 400,
              "convert": "USD"
          }

          response = requests.get(
              url,
              headers=headers,
              params=params,
              timeout=60
          )

          response.raise_for_status()

          payload = response.json()

          if "data" not in payload:
              raise RuntimeError("CMC returned no data")

          coins = payload["data"]

          # ---------------------------------------------
          # LOAD HISTORY
          # ---------------------------------------------

          if DATA_FILE.exists():
              try:
                  history = json.loads(
                      DATA_FILE.read_text()
                  )
              except Exception:
                  history = {}
          else:
              history = {}

          now = datetime.now(timezone.utc)
          now_ts = int(now.timestamp())

          candidates = []

          # ---------------------------------------------
          # SCAN TOP 400
          # ---------------------------------------------

          for coin in coins:

              symbol = coin.get("symbol", "")
              name = coin.get("name", "")
              rank = coin.get("cmc_rank")

              quote = (
                  coin.get("quote", {})
                  .get("USD", {})
              )

              price = quote.get("price") or 0
              volume = quote.get("volume_24h") or 0

              change_1h = (
                  quote.get("percent_change_1h") or 0
              )

              change_24h = (
                  quote.get("percent_change_24h") or 0
              )

              change_7d = (
                  quote.get("percent_change_7d") or 0
              )

              if not symbol or volume <= 0:
                  continue

              if symbol not in history:
                  history[symbol] = []

              # ---------------------------------------------
              # SAVE CURRENT SNAPSHOT
              # ---------------------------------------------

              history[symbol].append({
                  "timestamp": now_ts,
                  "volume": volume,
                  "price": price
              })

              # ---------------------------------------------
              # KEEP 30 DAYS
              # ---------------------------------------------

              cutoff = (
                  now_ts -
                  (30 * 24 * 60 * 60)
              )

              history[symbol] = [
                  item
                  for item in history[symbol]
                  if item.get("timestamp", 0) >= cutoff
              ]

              # ---------------------------------------------
              # TARGET TIMES
              # ---------------------------------------------

              target_1d = (
                  now_ts -
                  (1 * 24 * 60 * 60)
              )

              target_3d = (
                  now_ts -
                  (3 * 24 * 60 * 60)
              )

              target_7d = (
                  now_ts -
                  (7 * 24 * 60 * 60)
              )

              target_14d = (
                  now_ts -
                  (14 * 24 * 60 * 60)
              )

              previous_1d = None
              previous_3d = None
              previous_7d = None
              previous_14d = None

              # ---------------------------------------------
              # FIND CLOSEST HISTORICAL SNAPSHOTS
              # ---------------------------------------------

              for snapshot in history[symbol]:

                  ts = snapshot.get("timestamp", 0)

                  diff1 = abs(
                      ts - target_1d
                  )

                  diff3 = abs(
                      ts - target_3d
                  )

                  diff7 = abs(
                      ts - target_7d
                  )

                  diff14 = abs(
                      ts - target_14d
                  )

                  if diff1 <= (18 * 60 * 60):

                      if (
                          previous_1d is None
                          or diff1 <
                          abs(
                              previous_1d["timestamp"]
                              - target_1d
                          )
                      ):
                          previous_1d = snapshot

                  if diff3 <= (24 * 60 * 60):

                      if (
                          previous_3d is None
                          or diff3 <
                          abs(
                              previous_3d["timestamp"]
                              - target_3d
                          )
                      ):
                          previous_3d = snapshot

                  if diff7 <= (36 * 60 * 60):

                      if (
                          previous_7d is None
                          or diff7 <
                          abs(
                              previous_7d["timestamp"]
                              - target_7d
                          )
                      ):
                          previous_7d = snapshot

                  if diff14 <= (36 * 60 * 60):

                      if (
                          previous_14d is None
                          or diff14 <
                          abs(
                              previous_14d["timestamp"]
                              - target_14d
                          )
                      ):
                          previous_14d = snapshot

              # ---------------------------------------------
              # VOLUME CHANGE
              # ---------------------------------------------

              volume_change_1d = None
              volume_change_3d = None
              volume_change_7d = None
              volume_change_14d = None

              if (
                  previous_1d
                  and previous_1d["volume"] > 0
              ):
                  volume_change_1d = (
                      (
                          volume /
                          previous_1d["volume"]
                      ) - 1
                  ) * 100

              if (
                  previous_3d
                  and previous_3d["volume"] > 0
              ):
                  volume_change_3d = (
                      (
                          volume /
                          previous_3d["volume"]
                      ) - 1
                  ) * 100

              if (
                  previous_7d
                  and previous_7d["volume"] > 0
              ):
                  volume_change_7d = (
                      (
                          volume /
                          previous_7d["volume"]
                      ) - 1
                  ) * 100

              if (
                  previous_14d
                  and previous_14d["volume"] > 0
              ):
                  volume_change_14d = (
                      (
                          volume /
                          previous_14d["volume"]
                      ) - 1
                  ) * 100

              # ---------------------------------------------
              # EARLY VOLUME FILTER
              #
              # ANY POSITIVE INCREASE COUNTS.
              # NO 2% / 3% MINIMUM.
              # NO PRICE FILTER.
              # ---------------------------------------------

              available_changes = [
                  x for x in [
                      volume_change_1d,
                      volume_change_3d,
                      volume_change_7d,
                      volume_change_14d
                  ]
                  if x is not None
              ]

              if not available_changes:
                  continue

              if not any(
                  change > 0
                  for change in available_changes
              ):
                  continue

              volume_score = max(
                  available_changes
              )

              candidates.append({
                  "name": name,
                  "symbol": symbol,
                  "rank": rank,
                  "price": price,
                  "change_1h": change_1h,
                  "change_24h": change_24h,
                  "change_7d": change_7d,
                  "volume": volume,
                  "volume_change_1d": volume_change_1d,
                  "volume_change_3d": volume_change_3d,
                  "volume_change_7d": volume_change_7d,
                  "volume_change_14d": volume_change_14d,
                  "volume_score": volume_score
              })

          # ---------------------------------------------
          # SAVE HISTORY
          # ---------------------------------------------

          DATA_FILE.write_text(
              json.dumps(
                  history,
                  indent=2
              )
          )

          # ---------------------------------------------
          # SORT CANDIDATES
          # ---------------------------------------------

          candidates.sort(
              key=lambda x: x["volume_score"],
              reverse=True
          )

          # ---------------------------------------------
          # TELEGRAM MESSAGE
          # ---------------------------------------------

          if candidates:

              message = (
                  "🐋 FIL BEFORE PUMP — "
                  "EARLY VOLUME SCAN\n\n"
                  "📊 Scanner: Top 400\n"
                  "📈 Filter: Increasing volume\n"
                  "🔎 History: 1D / 3D / 7D / 14D\n"
                  "❌ No price % filter\n"
                  "❌ No minimum volume %\n\n"
                  "⚠️ Volume layer only.\n"
                  "Wallet / Whale / Technical "
                  "confirmation comes next.\n\n"
              )

              for candidate in candidates[:30]:

                  def fmt(value):
                      if value is None:
                          return "N/A"
                      return f"{value:+.2f}%"

                  message += (
                      f"🔹 {candidate['name']} "
                      f"({candidate['symbol']})\n"
                      f"Rank: #{candidate['rank']}\n"
                      f"Price: "
                      f"${candidate['price']:.8f}\n"
                      f"1h: "
                      f"{candidate['change_1h']:+.2f}%\n"
                      f"24h: "
                      f"{candidate['change_24h']:+.2f}%\n"
                      f"7d Price: "
                      f"{candidate['change_7d']:+.2f}%\n"
                      f"24h Volume: "
                      f"${candidate['volume']:,.0f}\n"
                      f"Volume vs 1D: "
                      f"{fmt(candidate['volume_change_1d'])}\n"
                      f"Volume vs 3D: "
                      f"{fmt(candidate['volume_change_3d'])}\n"
                      f"Volume vs 7D: "
                      f"{fmt(candidate['volume_change_7d'])}\n"
                      f"Volume vs 14D: "
                      f"{fmt(candidate['volume_change_14d'])}\n\n"
                  )

          else:

              message = (
                  "🐋 FIL BEFORE PUMP\n\n"
                  "No increasing-volume candidates "
                  "found in Top 400.\n\n"
                  "📊 History: 1D / 3D / 7D / 14D\n"
                  "❌ No price filter\n"
                  "❌ No minimum volume threshold"
              )

          # ---------------------------------------------
          # SEND TELEGRAM
          # ---------------------------------------------

          telegram_url = (
              f"https://api.telegram.org/"
              f"bot{BOT_TOKEN}/sendMessage"
          )

          telegram_response = requests.post(
              telegram_url,
              data={
                  "chat_id": CHAT_ID,
                  "text": message
              },
              timeout=30
          )

          telegram_response.raise_for_status()

          print(message)
          print(
              "✅ Telegram message sent successfully."
          )

          PY

      # ---------------------------------------------
      # SAVE HISTORY SAFELY
      # ---------------------------------------------

      - name: Save volume history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add volume_history.json

          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi

          git commit -m "Update volume history"

          git push origin HEAD:main
