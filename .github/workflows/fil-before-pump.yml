name: Fil Before Pump Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run scanner
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from pathlib import Path
          from datetime import datetime, timezone

          CMC_API_KEY = os.environ["CMC_API_KEY"]
          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          DATA_FILE = Path("volume_history.json")

          headers = {
              "X-CMC_PRO_API_KEY": CMC_API_KEY,
              "Accept": "application/json"
          }

          url = "https://pro-api.coinmarketcap.com/v1/cryptocurrency/listings/latest"

          params = {
              "start": 1,
              "limit": 400,
              "convert": "USD"
          }

          response = requests.get(
              url,
              headers=headers,
              params=params,
              timeout=60
          )

          response.raise_for_status()

          payload = response.json()

          if "data" not in payload:
              raise RuntimeError("CMC returned no data")

          coins = payload["data"]

          # Load previous volume history
          if DATA_FILE.exists():
              try:
                  history = json.loads(DATA_FILE.read_text())
              except Exception:
                  history = {}
          else:
              history = {}

          now = datetime.now(timezone.utc)
          now_ts = int(now.timestamp())

          candidates = []

          for coin in coins:

              symbol = coin.get("symbol", "")
              name = coin.get("name", "")
              rank = coin.get("cmc_rank")

              quote = coin.get("quote", {}).get("USD", {})

              price = quote.get("price") or 0
              volume = quote.get("volume_24h") or 0

              change_1h = quote.get("percent_change_1h") or 0
              change_24h = quote.get("percent_change_24h") or 0
              change_7d = quote.get("percent_change_7d") or 0

              if not symbol or volume <= 0:
                  continue

              if symbol not in history:
                  history[symbol] = []

              # Save current volume snapshot
              history[symbol].append({
                  "timestamp": now_ts,
                  "volume": volume,
                  "price": price
              })

              # Keep last 30 days
              cutoff = now_ts - (30 * 24 * 60 * 60)

              history[symbol] = [
                  x for x in history[symbol]
                  if x["timestamp"] >= cutoff
              ]

              # Targets for 7 and 14 days ago
              target_7d = now_ts - (7 * 24 * 60 * 60)
              target_14d = now_ts - (14 * 24 * 60 * 60)

              previous_7d = None
              previous_14d = None

              # Find closest historical snapshot
              for snapshot in history[symbol]:

                  diff7 = abs(
                      snapshot["timestamp"] - target_7d
                  )

                  diff14 = abs(
                      snapshot["timestamp"] - target_14d
                  )

                  if diff7 <= (36 * 60 * 60):

                      if (
                          previous_7d is None
                          or diff7 <
                          abs(
                              previous_7d["timestamp"]
                              - target_7d
                          )
                      ):
                          previous_7d = snapshot

                  if diff14 <= (36 * 60 * 60):

                      if (
                          previous_14d is None
                          or diff14 <
                          abs(
                              previous_14d["timestamp"]
                              - target_14d
                          )
                      ):
                          previous_14d = snapshot

              volume_change_7d = None
              volume_change_14d = None

              # Compare current volume with 7 days ago
              if previous_7d and previous_7d["volume"] > 0:

                  volume_change_7d = (
                      (volume / previous_7d["volume"]) - 1
                  ) * 100

              # Compare current volume with 14 days ago
              if previous_14d and previous_14d["volume"] > 0:

                  volume_change_14d = (
                      (volume / previous_14d["volume"]) - 1
                  ) * 100

              # IMPORTANT:
              # No 2% threshold.
              # No price-growth filter.
              #
              # Candidate means:
              # volume is increasing compared with
              # 7 days ago OR 14 days ago.

              volume_is_increasing = False

              if (
                  volume_change_7d is not None
                  and volume_change_7d > 0
              ):
                  volume_is_increasing = True

              if (
                  volume_change_14d is not None
                  and volume_change_14d > 0
              ):
                  volume_is_increasing = True

              if not volume_is_increasing:
                  continue

              candidates.append({
                  "name": name,
                  "symbol": symbol,
                  "rank": rank,
                  "price": price,
                  "change_1h": change_1h,
                  "change_24h": change_24h,
                  "change_7d": change_7d,
                  "volume": volume,
                  "volume_change_7d": volume_change_7d,
                  "volume_change_14d": volume_change_14d
              })

          # Save history
          DATA_FILE.write_text(
              json.dumps(history, indent=2)
          )

          # Sort by strongest volume increase
          def score(candidate):

              values = [
                  candidate["volume_change_7d"] or 0,
                  candidate["volume_change_14d"] or 0
              ]

              return max(values)

          candidates.sort(
              key=score,
              reverse=True
          )

          # Telegram message
          if candidates:

              message = (
                  "🐋 FIL BEFORE PUMP — VOLUME CANDIDATES\n\n"
                  "📊 Scanner: Top 400\n"
                  "📈 Filter: Volume increase only\n"
                  "🔎 Windows: 7D / 14D\n"
                  "❌ No price % filter\n"
                  "❌ No 2% volume threshold\n\n"
              )

              for c in candidates[:30]:

                  v7 = (
                      f"{c['volume_change_7d']:+.2f}%"
                      if c["volume_change_7d"] is not None
                      else "N/A"
                  )

                  v14 = (
                      f"{c['volume_change_14d']:+.2f}%"
                      if c["volume_change_14d"] is not None
                      else "N/A"
                  )

                  message += (
                      f"🔹 {c['name']} ({c['symbol']})\n"
                      f"Rank: #{c['rank']}\n"
                      f"Price: ${c['price']:.8f}\n"
                      f"1h: {c['change_1h']:+.2f}%\n"
                      f"24h: {c['change_24h']:+.2f}%\n"
                      f"7d Price: {c['change_7d']:+.2f}%\n"
                      f"24h Volume: ${c['volume']:,.0f}\n"
                      f"Volume vs 7d: {v7}\n"
                      f"Volume vs 14d: {v14}\n\n"
                  )

          else:

              message = (
                  "🐋 FIL BEFORE PUMP\n\n"
                  "No coins with increasing volume "
                  "were found in the Top 400.\n\n"
                  "📊 Checked: 7D / 14D volume history"
              )

          # Send Telegram
          telegram_url = (
              f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"
          )

          telegram_response = requests.post(
              telegram_url,
              data={
                  "chat_id": CHAT_ID,
                  "text": message
              },
              timeout=30
          )

          telegram_response.raise_for_status()

          print(message)
          print("✅ Telegram message sent successfully.")

          PY

      - name: Save volume history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add volume_history.json

          git diff --cached --quiet || git commit -m "Update volume history"

          git push
