name: Fil Before Pump Scanner

on:
  workflow_dispatch:
    inputs:
      rank_range:
        description: "Telegram rank range"
        required: false
        default: "all"
      filter:
        description: "Telegram filter"
        required: false
        default: "all"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: fil-before-pump-repo-writers
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade requests
          npm install -g gmgn-cli

      - name: Test Nansen API connectivity
        env:
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
        shell: bash
        run: |
          set +e

          if [ -z "${NANSEN_API_KEY:-}" ]; then
            printf 'HTTP_STATUS=MISSING_SECRET\n' > nansen_test_result.txt
            exit 0
          fi

          BODY='{
            "address":"0x28c6c06298d514db089934071355e5743bf21d60",
            "chain":"ethereum",
            "date":{
              "from":"2026-09-20T00:00:00Z",
              "to":"2026-09-21T23:59:59Z"
            },
            "pagination":{
              "page":1,
              "per_page":2
            }
          }'

          TMP=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$TMP" -w "%{http_code}" \
            -X POST "https://api.nansen.ai/api/v1/profiler/address/historical-balances" \
            -H "apiKey: ${NANSEN_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            --data "$BODY")

          python3 - "$TMP" "$HTTP_CODE" <<'PY'
          import json, sys
          p, code = sys.argv[1], sys.argv[2]
          out = [f"HTTP_STATUS={code}"]
          try:
              obj=json.load(open(p))
              if isinstance(obj, dict):
                  out.append("RESPONSE_KEYS=" + ",".join(sorted(obj.keys())))
                  data=obj.get("data")
                  if isinstance(data, list):
                      out.append("DATA_COUNT=" + str(len(data)))
                  pagination=obj.get("pagination")
                  if isinstance(pagination, dict):
                      out.append("IS_LAST_PAGE=" + str(pagination.get("is_last_page")))
                  if "error" in obj:
                      out.append("ERROR_PRESENT=true")
          except Exception as e:
              out.append("JSON_PARSE_ERROR=" + type(e).__name__)
          open("nansen_test_result.txt","w").write("\n".join(out)+"\n")
          print("\n".join(out))
          PY

          rm -f "$TMP"
          exit 0

      - name: Run Fil Before Pump scanner
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
          GOLDRUSH_API_KEY: ${{ secrets.GOLDRUSH_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
          BOT_RANK_RANGE: ${{ github.event.inputs.rank_range || 'all' }}
          BOT_FILTER: ${{ github.event.inputs.filter || 'all' }}
        run: python wallet_enhancement.py

      - name: Save volume history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volume_history.json wallet_history.json wallet_events.json futures_volume_history.json gmgn_wallet_history.json nansen_test_result.txt
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "Update scanner history"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
