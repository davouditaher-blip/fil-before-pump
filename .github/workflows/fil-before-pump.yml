name: Fil Before Pump Scanner

on:
  push:
    branches:
      - main
    paths-ignore:
      - "volume_history.json"
      - "wallet_history.json"
      - "wallet_events.json"
      - "futures_volume_history.json"
      - "gmgn_wallet_history.json"
      - "wallet_quality.json"
      - "wallet_clusters.json"
  workflow_dispatch:
    inputs:
      rank_range:
        description: "Telegram rank range"
        required: false
        default: "all"
      filter:
        description: "Telegram filter"
        required: false
        default: "all"
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: fil-before-pump-repo-writers
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          npm install -g gmgn-cli

      - name: Run Fil Before Pump scanner with retry
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
          GOLDRUSH_API_KEY: ${{ secrets.GOLDRUSH_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
          BOT_RANK_RANGE: ${{ github.event.inputs.rank_range || 'all' }}
          BOT_FILTER: ${{ github.event.inputs.filter || 'all' }}
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Scanner attempt $attempt/3"
            python wallet_quality_engine.py
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep 20
            fi
          done
          exit "$status"

      - name: Build cross-wallet clusters
        run: |
          set -e
          python wallet_clustering.py

      - name: Save scanner history safely
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add volume_history.json wallet_history.json wallet_events.json futures_volume_history.json gmgn_wallet_history.json wallet_quality.json wallet_clusters.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi

          git commit -m "Update scanner wallet intelligence"

          # Other scheduled jobs can update main while this scan is running.
          # Rebase with the scanner commit's history files winning conflicts,
          # then retry the push so concurrent history writers do not break the run.
          for attempt in 1 2 3 4 5; do
            echo "History push attempt $attempt/5"
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then
                echo "History push succeeded."
                exit 0
              fi
              echo "Push raced with another writer; retrying."
            else
              echo "Rebase conflict; aborting rebase before retry."
              git rebase --abort || true
            fi
            sleep 10
          done

          echo "Unable to push scanner history after 5 attempts."
          exit 1
