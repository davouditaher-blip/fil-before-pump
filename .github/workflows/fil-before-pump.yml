name: Fil Before Pump Scanner

on:
  push:
    branches: [main]
    paths-ignore:
      - "volume_history.json"
      - "wallet_history.json"
      - "wallet_events.json"
      - "futures_volume_history.json"
      - "gmgn_wallet_history.json"
      - "wallet_quality.json"
      - "wallet_clusters.json"
      - "wallet_radar.json"
      - "trade_readiness.json"
      - "paper_trades.json"
      - "paper_performance.json"
      - "wallet_paper_feedback.json"
      - "wallet_performance_memory.json"
  workflow_dispatch:
    inputs:
      rank_range:
        description: "Telegram rank range"
        required: false
        type: string
        default: "all"
      filter:
        description: "Telegram filter"
        required: false
        type: string
        default: "all"
  repository_dispatch:
    types: [telegram_scan]
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

concurrency:
  group: scanner-history-writer
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
      GOLDRUSH_API_KEY: ${{ secrets.GOLDRUSH_API_KEY }}
      COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
      GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
      NANSEN_API_KEY: ${{ secrets.NANSEN_API_KEY }}
      BOT_RANK_RANGE: ${{ github.event.inputs.rank_range || github.event.client_payload.rank_range || 'all' }}
      BOT_FILTER: ${{ github.event.inputs.filter || github.event.client_payload.filter || 'all' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          npm install -g gmgn-cli

      - name: Validate Python modules
        run: |
          python -m py_compile scanner.py gmgn_layer.py wallet_quality_engine.py
          python -m py_compile wallet_clustering.py wallet_radar.py wallet_performance_memory.py
          python -m py_compile trade_readiness.py risk_engine.py paper_trading.py
          python -m py_compile paper_performance.py wallet_paper_feedback.py
          python -m py_compile e2e_validate.py final_integration_gate.py

      - name: Build wallet quality
        run: |
          set -e
          for attempt in 1 2 3; do
            echo "Wallet quality attempt $attempt/3"
            if WALLET_QUALITY_ONLY=1 python wallet_quality_engine.py; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep 20
          done

      - name: Build cross-wallet clusters
        run: python wallet_clustering.py

      - name: Build $5K wallet radar
        run: python wallet_radar.py

      - name: Run integrated scanner
        run: python wallet_quality_engine.py

      - name: Validate scanner artifacts
        run: |
          python smoke_test.py
          python e2e_validate.py

      - name: Build paper performance
        run: python paper_performance.py

      - name: Build wallet paper feedback
        run: python wallet_paper_feedback.py

      - name: Rebuild wallet performance memory from latest feedback
        run: python wallet_performance_memory.py

      - name: Final integration safety gate
        run: python final_integration_gate.py

      - name: Persist scanner history
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volume_history.json wallet_history.json wallet_events.json futures_volume_history.json gmgn_wallet_history.json wallet_quality.json wallet_clusters.json wallet_radar.json trade_readiness.json paper_trades.json paper_performance.json wallet_paper_feedback.json wallet_performance_memory.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "Update scanner wallet intelligence"
          for attempt in 1 2 3 4 5; do
            echo "History push attempt $attempt/5"
            git fetch origin main
            if git rebase -X theirs origin/main && git push origin HEAD:main; then
              echo "History push succeeded."
              exit 0
            fi
            git rebase --abort || true
            sleep 10
          done
          exit 1

  health:
    if: ${{ always() }}
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check Render health
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          code="$(curl -L --max-time 20 -sS -o /tmp/render_body -w "%{http_code}" "https://fil-before-pump.onrender.com/")"
          status=$?
          echo "Render HTTP status: $code"
          if [ "$status" -ne 0 ] || [ "$code" -lt 200 ] || [ "$code" -ge 500 ]; then
            echo "Render health check failed."
            if [ -n "${TELEGRAM_BOT_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"                 -d "chat_id=${TELEGRAM_CHAT_ID}"                 --data-urlencode "text=⚠️ Fil Before Pump Render health check failed. HTTP=${code:-no-response}" >/dev/null || true
            fi
            exit 1
          fi
          echo "Render service is reachable."
