name: Fil Before Pump Scanner

on:
  workflow_dispatch:
    inputs:
      rank_range:
        description: "Telegram rank range"
        required: false
        default: "all"
      filter:
        description: "Telegram filter"
        required: false
        default: "all"

permissions:
  contents: write
  actions: write

concurrency:
  group: fil-before-pump-repo-writers
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade requests
          npm install -g gmgn-cli

      - name: Run Fil Before Pump scanner
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOLSCAN_API_KEY: ${{ secrets.SOLSCAN_API_KEY }}
          GOLDRUSH_API_KEY: ${{ secrets.GOLDRUSH_API_KEY }}
          COINGLASS_API_KEY: ${{ secrets.COINGLASS_API_KEY }}
          GMGN_API_KEY: ${{ secrets.GMGN_API_KEY }}
          BOT_RANK_RANGE: ${{ github.event.inputs.rank_range || 'all' }}
          BOT_FILTER: ${{ github.event.inputs.filter || 'all' }}
        run: python wallet_enhancement.py

      - name: Save volume history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add volume_history.json wallet_history.json wallet_events.json futures_volume_history.json gmgn_wallet_history.json
          if git diff --cached --quiet; then
            echo "No history changes to commit."
            exit 0
          fi
          git commit -m "Update scanner history"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
