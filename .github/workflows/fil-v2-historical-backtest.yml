name: Fil V2 Historical Backtest

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fil-v2-autonomous-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install -U pip pytest
      - name: Compile
        run: python -m compileall -q fil_engine tools
      - name: Unit tests
        run: PYTHONPATH=. pytest -q tests
      - name: Historical proxy backtest
        run: PYTHONPATH=. python tools/run_historical_backtest.py
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: fil-v2-historical-backtest
          path: fil_v2_backtest_report.json
