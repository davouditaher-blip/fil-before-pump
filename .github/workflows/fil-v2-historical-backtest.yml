name: Fil V2 Historical Backtest

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Requested windows"
        required: false
        default: "30,90,180"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fil-v2-autonomous-engine
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m compileall -q fil_engine tools
      - name: Unit tests
        run: pytest -q tests
      - name: Historical proxy backtest
        run: python tools/run_historical_backtest.py
      - name: Upload backtest report
        uses: actions/upload-artifact@v4
        with:
          name: fil-v2-historical-backtest
          path: fil_v2_backtest_report.json
